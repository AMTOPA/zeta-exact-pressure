name: build-paper

on:
  push:
    branches: [main]
    paths:
      - 'paper/main.tex'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-paper-main
  cancel-in-progress: true

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=paper paper/main.tex

      - name: Commit compiled PDF
        run: |
          if git diff --quiet -- paper/main.pdf && git ls-files --error-unmatch paper/main.pdf >/dev/null 2>&1; then
            echo 'paper/main.pdf unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo 'No PDF change to commit'
            exit 0
          fi
          git commit -m 'Build paper PDF [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
