name: joint-pressure-epsilon-edge

on:
  push:
    branches: [main]
    paths:
      - discovery_candidate.json
      - src/candidate_data.py
      - src/write_verifier_config.py
      - src/verify_local_tables.cpp
      - .github/workflows/discovery-certificate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZETA_CANDIDATE_PATH: discovery_candidate.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Compile hardened six-gap verifier
        run: |
          rm -rf smoke build tables-discovery
          python3 src/build_interval_tables.py --output smoke --smoke-cells 64 --precision 45 --workers 4
          mkdir -p build
          python3 src/write_verifier_config.py --output build/candidate_config.hpp
          grep 'gaps = 6' build/candidate_config.hpp
          grep 'pressure_total_num = 186000000' build/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild src/verify_local_tables.cpp -o build/verify_local_tables

      - name: Reuse certified outward-rounded tables
        run: |
          gh run download 31604769082 -n joint-pressure-epsilon-tighten-hardened
          test -f tables-discovery/w_lower.bin
          test -f tables-discovery/w_second_lower.bin
          test -f tables-discovery/w_mid_lower.bin
          test -f tables-discovery/w_mid_upper.bin
          test -f tables-discovery/w_prime_mid_lower.bin
          test -f tables-discovery/w_prime_mid_upper.bin
          test -f tables-discovery/manifest.json

      - name: Run near-limit hardened epsilon ladder
        shell: bash
        run: |
          : > edge-certificate.log
          probe() {
            num="$1"; den="$2"; label="$3"
            echo "===== ${label} = ${num}/${den} =====" | tee -a edge-certificate.log
            set +e
            build/verify_local_tables "$num" "$den" tables-discovery 80000000 | tee -a edge-certificate.log
            code=${PIPESTATUS[0]}
            set -e
            echo "${label}_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$code" != "0" && "$code" != "3" ]]; then exit "$code"; fi
            return "$code"
          }

          set +e
          probe 39439 5000000 eps_0078878
          code=$?
          set -e
          if [[ "$code" == "3" ]]; then
            set +e
            probe 31551 4000000 eps_00788775
            code=$?
            set -e
          fi
          if [[ "$code" == "3" ]]; then
            set +e
            probe 78877 10000000 eps_0078877
            code=$?
            set -e
          fi
          if [[ "$code" == "3" ]]; then
            set +e
            probe 157753 20000000 eps_00788765
            code=$?
            set -e
          fi
          if [[ "$code" == "3" ]]; then
            set +e
            probe 19719 2500000 eps_0078876
            code=$?
            set -e
          fi
          if [[ "$code" != "0" && "$code" != "3" ]]; then exit "$code"; fi

      - name: Upload edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-pressure-epsilon-edge-hardened
          path: |
            tables-discovery/manifest.json
            edge-certificate.log
          if-no-files-found: warn
