name: final-bound-window-certificate

on:
  push:
    branches: [main]
    paths:
      - discovery_candidate.json
      - src/candidate_data.py
      - src/check_discovery_candidate.py
      - src/build_interval_tables.py
      - src/write_verifier_config.py
      - src/verify_local_tables.cpp
      - .github/workflows/discovery-certificate.yml
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZETA_CANDIDATE_PATH: discovery_candidate.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Validate exact structure and interval window
        run: |
          python3 src/check_discovery_candidate.py

      - name: Compile hardened six-gap verifier smoke
        run: |
          rm -rf smoke build
          python3 src/build_interval_tables.py --output smoke --smoke-cells 64 --precision 45 --workers 4
          mkdir -p build
          python3 src/write_verifier_config.py --output build/candidate_config.hpp
          grep 'gaps = 6' build/candidate_config.hpp
          grep 'pressure_total_num = 186000000' build/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild src/verify_local_tables.cpp -o build/verify_local_tables

      - name: Build fresh outward-rounded tables for new window
        run: |
          rm -rf tables-final-bound-window
          python3 src/build_interval_tables.py \
            --output tables-final-bound-window \
            --grid 4000 \
            --precision 50 \
            --workers 4

      - name: Run hardened target ladder
        shell: bash
        run: |
          : > final-bound-window-certificate.log
          probe() {
            num="$1"; den="$2"; label="$3"
            echo "===== ${label} = ${num}/${den} =====" | tee -a final-bound-window-certificate.log
            build/verify_local_tables "$num" "$den" tables-final-bound-window 80000000 \
              | tee -a final-bound-window-certificate.log
            return ${PIPESTATUS[0]}
          }

          set +e
          probe 7897 1000000 eps_007897
          code=$?
          if [[ "$code" == "3" ]]; then
            probe 9871 1250000 eps_0078968
            code=$?
          fi
          if [[ "$code" == "3" ]]; then
            probe 15793 2000000 eps_0078965
            code=$?
          fi
          if [[ "$code" == "3" ]]; then
            probe 987 125000 eps_007896
            code=$?
          fi
          set -e
          echo "final_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" && "$code" != "3" ]]; then exit "$code"; fi

      - name: Upload certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-bound-window-certificate-hardened
          path: |
            tables-final-bound-window/manifest.json
            tables-final-bound-window/*.bin
            final-bound-window-certificate.log
          if-no-files-found: warn
