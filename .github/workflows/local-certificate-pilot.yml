name: local-certificate-pilot

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Build full interval tables
        run: |
          python3 src/build_interval_tables.py \
            --output tables-15term \
            --grid 4000 \
            --precision 50

      - name: Build native verifier
        run: |
          mkdir -p build
          python3 src/write_verifier_config.py --output build/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild src/verify_local_tables.cpp -o build/verify_local_tables

      - name: Run current candidate target
        shell: bash
        run: |
          read target_num target_den < <(python3 - <<'PY'
          import json
          from fractions import Fraction
          c=json.load(open('candidate.json'))
          q=c['local_search']['candidate_target_for_certification']
          f=Fraction(int(q['numerator']),int(q['denominator']))
          print(f.numerator, f.denominator)
          PY
          )
          set +e
          build/verify_local_tables "$target_num" "$target_den" tables-15term 50000000 \
            | tee certificate-pilot.log
          code=${PIPESTATUS[0]}
          set -e
          echo "target=${target_num}/${target_den}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "verifier_exit_code=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" && "$code" != "3" ]]; then
            exit "$code"
          fi

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-local-certificate-pilot
          path: |
            tables-15term/manifest.json
            certificate-pilot.log
          if-no-files-found: warn
