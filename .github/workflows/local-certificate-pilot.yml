name: local-certificate-pilot

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Build full interval tables
        run: |
          python3 src/build_interval_tables.py \
            --output tables-15term \
            --grid 4000 \
            --precision 50

      - name: Build native verifier
        run: |
          mkdir -p build
          python3 src/write_verifier_config.py --output build/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG \
            -Ibuild src/verify_local_tables.cpp -o build/verify_local_tables

      - name: Run accelerated robust-target pilot
        shell: bash
        run: |
          set +e
          build/verify_local_tables 5401 1000000 tables-15term 20000000 \
            | tee certificate-pilot.log
          code=${PIPESTATUS[0]}
          set -e
          echo "target_5401_exit_code=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" && "$code" != "3" ]]; then
            exit "$code"
          fi

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15term-robust-certificate-pilot
          path: |
            tables-15term/manifest.json
            certificate-pilot.log
          if-no-files-found: warn
