name: multilag-auxiliary-certificate

on:
  push:
    branches: [main]
    paths:
      - experiments/multilag/candidate.json
      - src/candidate_data.py
      - src/check_window.py
      - src/build_interval_tables.py
      - src/write_verifier_config.py
      - src/verify_local_tables.cpp
      - .github/workflows/multilag-certificate.yml
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZETA_CANDIDATE_PATH: experiments/multilag/candidate.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Check auxiliary structure and interval window
        run: |
          python3 - <<'PY'
          import json
          from fractions import Fraction
          c=json.load(open('experiments/multilag/candidate.json'))
          q=c['gaps_per_local_window']
          p=c['pair_weights']
          caps=p['span_capacity_numerators']
          assert q==6 and len(caps)==6
          for s in range(1,q+1):
              total=sum(int(n) for i,j,n in p['entries'] if int(j)-int(i)==s)
              assert total==int(caps[s-1]), (s,total,caps[s-1])
          assert [Fraction(x,p['denominator']) for x in caps] == [
              Fraction(52,25),Fraction(48,25),Fraction(52,25),
              Fraction(48,25),Fraction(52,25),Fraction(48,25)]
          pr=c['position_pressure']
          assert Fraction(sum(pr['numerators']),pr['denominator'])==Fraction(93,23000)
          print('multilag_span_capacities_exact=True')
          print('multilag_pressure_total_exact=True')
          PY
          python3 src/check_window.py

      - name: Compile generalized hardened verifier smoke
        run: |
          rm -rf smoke-multilag build-multilag
          python3 src/build_interval_tables.py --output smoke-multilag --smoke-cells 64 --precision 45 --workers 4
          mkdir -p build-multilag
          python3 src/write_verifier_config.py --output build-multilag/candidate_config.hpp
          grep 'gaps = 6' build-multilag/candidate_config.hpp
          grep '52000000000LL, 48000000000LL' build-multilag/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild-multilag src/verify_local_tables.cpp -o build-multilag/verify_local_tables

      - name: Build fresh outward-rounded tables
        run: |
          rm -rf tables-multilag
          python3 src/build_interval_tables.py \
            --output tables-multilag \
            --grid 4000 \
            --precision 50 \
            --workers 4

      - name: Run hardened auxiliary target ladder
        shell: bash
        run: |
          : > multilag-certificate.log
          probe() {
            num="$1"; den="$2"; label="$3"
            echo "===== ${label} = ${num}/${den} =====" | tee -a multilag-certificate.log
            build-multilag/verify_local_tables "$num" "$den" tables-multilag 80000000 \
              | tee -a multilag-certificate.log
            return ${PIPESTATUS[0]}
          }
          set +e
          probe 15889 2000000 eps_0079445
          code=$?
          if [[ "$code" == "3" ]]; then
            probe 993 125000 eps_0079440
            code=$?
          fi
          if [[ "$code" == "3" ]]; then
            probe 15887 2000000 eps_0079435
            code=$?
          fi
          set -e
          echo "final_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" && "$code" != "3" ]]; then exit "$code"; fi

      - name: Upload certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilag-auxiliary-certificate-hardened
          path: |
            tables-multilag/manifest.json
            tables-multilag/*.bin
            multilag-certificate.log
          if-no-files-found: warn
