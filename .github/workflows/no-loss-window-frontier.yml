name: no-loss-window-frontier-certificate

on:
  push:
    branches: [main]
    paths:
      - experiments/no-loss-window/frontier.json
      - src/check_no_loss_window.py
      - .github/workflows/no-loss-window-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VERIFIER_SOURCE_COMMIT: b3b7784ed0089c3c2197d740aaae1a424d142e44
      VERIFIER_SOURCE_BLOB: b10cdbeac16aed1c1076d5ce9b6e8ee22793dd21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Materialize standard candidate configs and validate exact frontier
        run: |
          rm -rf .no-loss-configs build-no-loss
          mkdir -p .no-loss-configs build-no-loss
          python3 - <<'PY'
          import copy,json,pathlib
          root=json.load(open('candidate.json'))
          f=json.load(open('experiments/no-loss-window/frontier.json'))
          out=pathlib.Path('.no-loss-configs')
          for line in f['supporting_lines']:
              c=copy.deepcopy(root)
              c['description']='temporary verifier config for no-loss-window '+line['name']
              c['window']=copy.deepcopy(f['window'])
              c['pair_weights']=copy.deepcopy(f['pair_weights'])
              c['position_pressure']=copy.deepcopy(line['pressure'])
              c['local_search']['candidate_target_for_certification']=copy.deepcopy(line['target'])
              c['local_search']['verified']=False
              c['local_certificate']['target']=copy.deepcopy(line['target'])
              c['local_certificate']['verified']=False
              (out/(line['name']+'.json')).write_text(json.dumps(c,indent=2)+'\n')
              print(line['name'],line['target'])
          PY
          python3 src/check_no_loss_window.py
          ZETA_CANDIDATE_PATH=.no-loss-configs/base.json python3 src/check_window.py

      - name: Pin root-certified accelerated verifier source
        run: |
          git fetch --no-tags --depth=1 origin "$VERIFIER_SOURCE_COMMIT"
          git show "$VERIFIER_SOURCE_COMMIT:src/verify_local_tables.cpp" > build-no-loss/verify_local_tables.cpp
          test "$(git hash-object build-no-loss/verify_local_tables.cpp)" = "$VERIFIER_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-no-loss/verify_local_tables.cpp')
          s=p.read_text()
          old='if (total != candidate_config::span_capacity_num)\n                throw std::runtime_error("pair span capacity mismatch");'
          new='if (total != candidate_config::span_capacity_num[span - 1])\n                throw std::runtime_error("pair span capacity mismatch");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          print('capacity_compatibility_patch_only=True')
          PY

      - name: Compile all five exact verifier configs
        run: |
          for name in base c105 c12 c16 c20; do
            mkdir -p "build-no-loss/$name"
            ZETA_CANDIDATE_PATH=".no-loss-configs/$name.json" \
              python3 src/write_verifier_config.py --output "build-no-loss/$name/candidate_config.hpp"
            g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
              -I"build-no-loss/$name" build-no-loss/verify_local_tables.cpp \
              -o "build-no-loss/$name/verify_local_tables"
          done

      - name: Build one fresh extended table set for the new window
        run: |
          rm -rf tables-no-loss-window
          ZETA_CANDIDATE_PATH=.no-loss-configs/c105.json \
            python3 src/build_interval_tables.py \
              --output tables-no-loss-window \
              --grid 4000 \
              --precision 50 \
              --workers 4

      - name: Run all hardened frontier targets
        shell: bash
        run: |
          : > no-loss-window-frontier.log
          probe() {
            name="$1"; num="$2"; den="$3"
            echo "===== $name $num/$den =====" | tee -a no-loss-window-frontier.log
            "build-no-loss/$name/verify_local_tables" "$num" "$den" tables-no-loss-window 80000000 \
              | tee -a no-loss-window-frontier.log
            return ${PIPESTATUS[0]}
          }
          probe base 3963 500000
          probe c105 8231 1000000
          probe c12 1129 125000
          probe c16 2227 200000
          probe c20 13 1000
          echo "all_frontier_targets_verified=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload no-loss-window certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-loss-window-frontier-certificate-hardened
          path: |
            tables-no-loss-window/manifest.json
            tables-no-loss-window/*.bin
            no-loss-window-frontier.log
          if-no-files-found: warn
