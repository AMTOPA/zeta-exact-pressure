name: pressure-frontier-c105-certificate

on:
  push:
    branches: [main]
    paths:
      - experiments/pressure-frontier/c105.json
      - src/check_pressure_bundle6.py
      - .github/workflows/pressure-frontier-c105.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZETA_CANDIDATE_PATH: experiments/pressure-frontier/c105.json
      VERIFIER_SOURCE_COMMIT: b3b7784ed0089c3c2197d740aaae1a424d142e44
      VERIFIER_SOURCE_BLOB: b10cdbeac16aed1c1076d5ce9b6e8ee22793dd21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Validate c=21/20 structure and exact m=576 arithmetic
        run: |
          python3 - <<'PY'
          import json
          from fractions import Fraction
          c=json.load(open('experiments/pressure-frontier/c105.json'))
          assert Fraction(c['local_search']['pressure_total_scale']['numerator'],c['local_search']['pressure_total_scale']['denominator'])==Fraction(21,20)
          t=c['local_search']['candidate_target_for_certification']
          assert Fraction(t['numerator'],t['denominator'])==Fraction(1641,200000)
          pr=c['position_pressure']
          assert Fraction(sum(pr['numerators']),pr['denominator'])==Fraction(1953,460000)
          print('pressure_frontier_c105_structure_exact=True')
          PY
          python3 src/check_window.py
          python3 src/check_pressure_bundle6.py

      - name: Compile root-certified accelerated verifier with capacity compatibility patch
        run: |
          rm -rf build-c105
          mkdir -p build-c105
          python3 src/write_verifier_config.py --output build-c105/candidate_config.hpp
          git fetch --no-tags --depth=1 origin "$VERIFIER_SOURCE_COMMIT"
          git show "$VERIFIER_SOURCE_COMMIT:src/verify_local_tables.cpp" > build-c105/verify_local_tables.cpp
          test "$(git hash-object build-c105/verify_local_tables.cpp)" = "$VERIFIER_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-c105/verify_local_tables.cpp')
          s=p.read_text()
          old='if (total != candidate_config::span_capacity_num)\n                throw std::runtime_error("pair span capacity mismatch");'
          new='if (total != candidate_config::span_capacity_num[span - 1])\n                throw std::runtime_error("pair span capacity mismatch");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          print('capacity_compatibility_patch_only=True')
          PY
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild-c105 build-c105/verify_local_tables.cpp -o build-c105/verify_local_tables

      - name: Build fresh extended outward-rounded tables
        run: |
          rm -rf tables-c105
          python3 src/build_interval_tables.py \
            --output tables-c105 \
            --grid 4000 \
            --precision 50 \
            --workers 4

      - name: Run hardened c=21/20 target
        shell: bash
        run: |
          : > pressure-frontier-c105.log
          set +e
          build-c105/verify_local_tables 1641 200000 tables-c105 80000000 \
            | tee pressure-frontier-c105.log
          code=${PIPESTATUS[0]}
          set -e
          echo "eps_008205_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" ]]; then exit "$code"; fi

      - name: Upload c=21/20 certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-frontier-c105-certificate-hardened
          path: |
            tables-c105/manifest.json
            tables-c105/*.bin
            pressure-frontier-c105.log
          if-no-files-found: warn
