name: pressure-supporting-line-certificate

on:
  push:
    branches: [main]
    paths:
      - experiments/multilag/candidate.json
      - src/candidate_data.py
      - src/write_verifier_config.py
      - src/verify_local_tables.cpp
      - .github/workflows/pressure-support-certificate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZETA_CANDIDATE_PATH: experiments/multilag/candidate.json
      TABLE_SOURCE_RUN: '31617160058'
      TABLE_SOURCE_ARTIFACT: multilag-auxiliary-certificate-hardened
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Validate pressure supporting-line candidate
        run: |
          python3 - <<'PY'
          import json
          from fractions import Fraction
          c=json.load(open('experiments/multilag/candidate.json'))
          assert c['window']['term_count']==17
          assert Fraction(c['local_search']['pressure_scale']['numerator'],c['local_search']['pressure_scale']['denominator'])==Fraction(6,5)
          p=c['pair_weights']
          for s in range(1,7):
              total=sum(int(n) for i,j,n in p['entries'] if int(j)-int(i)==s)
              assert Fraction(total,p['denominator'])==2
          pr=c['position_pressure']
          assert Fraction(sum(pr['numerators']),pr['denominator'])==Fraction(279,57500)
          print('pressure_support_structure_exact=True')
          PY
          python3 src/check_window.py
          python3 src/check_multilag.py

      - name: Compile exact auxiliary verifier
        run: |
          rm -rf build-pressure-support
          mkdir -p build-pressure-support
          python3 src/write_verifier_config.py --output build-pressure-support/candidate_config.hpp
          grep 'gaps = 6' build-pressure-support/candidate_config.hpp
          grep 'pressure_total_num = 1116000000' build-pressure-support/candidate_config.hpp
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild-pressure-support src/verify_local_tables.cpp -o build-pressure-support/verify_local_tables

      - name: Wait for and reuse shared 17-term tables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "$TABLE_SOURCE_RUN" --exit-status
          rm -rf tables-multilag
          gh run download "$TABLE_SOURCE_RUN" -n "$TABLE_SOURCE_ARTIFACT"
          test -f tables-multilag/w_lower.bin
          test -f tables-multilag/w_second_lower.bin
          test -f tables-multilag/w_mid_lower.bin
          test -f tables-multilag/w_mid_upper.bin
          test -f tables-multilag/w_prime_mid_lower.bin
          test -f tables-multilag/w_prime_mid_upper.bin
          test -f tables-multilag/manifest.json

      - name: Run hardened pressure-support target ladder
        shell: bash
        run: |
          : > pressure-support-certificate.log
          probe() {
            num="$1"; den="$2"; label="$3"
            echo "===== ${label} = ${num}/${den} =====" | tee -a pressure-support-certificate.log
            build-pressure-support/verify_local_tables "$num" "$den" tables-multilag 80000000 \
              | tee -a pressure-support-certificate.log
            return ${PIPESTATUS[0]}
          }
          set +e
          probe 17997 2000000 eps_0089985
          code=$?
          if [[ "$code" == "3" ]]; then
            probe 4499 500000 eps_0089980
            code=$?
          fi
          if [[ "$code" == "3" ]]; then
            probe 17995 2000000 eps_0089975
            code=$?
          fi
          set -e
          echo "final_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" && "$code" != "3" ]]; then exit "$code"; fi

      - name: Upload pressure-support evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-supporting-line-certificate-hardened
          path: |
            tables-multilag/manifest.json
            pressure-support-certificate.log
          if-no-files-found: warn
