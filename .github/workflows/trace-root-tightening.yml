name: trace-root-tightening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trace-root-tightening.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZETA_CANDIDATE_PATH: candidate.json
      TABLE_SOURCE_RUN: '31610179703'
      TABLE_SOURCE_ARTIFACT: second-exchange-17term-certificate-hardened
      VERIFIER_SOURCE_COMMIT: b3b7784ed0089c3c2197d740aaae1a424d142e44
      VERIFIER_SOURCE_BLOB: b10cdbeac16aed1c1076d5ce9b6e8ee22793dd21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Validate root tightening inputs
        run: |
          python3 - <<'PY'
          import json
          from fractions import Fraction
          c=json.load(open('candidate.json'))
          assert c['window']['term_count']==17
          assert c['local_certificate']['verified'] is True
          assert Fraction(c['local_certificate']['target']['numerator'],c['local_certificate']['target']['denominator'])==Fraction(79107,10_000_000)
          assert float(c['local_search']['float_minimum_observed'].replace('...','')) > 0.0079111
          assert Fraction(c['position_pressure']['total']['numerator'],c['position_pressure']['total']['denominator'])==Fraction(93,23000)
          print('trace_root_frontier_inputs_ok=True')
          PY
          python3 src/check_window.py

      - name: Compile root-certified accelerated verifier with capacity compatibility patch
        run: |
          rm -rf build-trace-root
          mkdir -p build-trace-root
          python3 src/write_verifier_config.py --output build-trace-root/candidate_config.hpp
          git fetch --no-tags --depth=1 origin "$VERIFIER_SOURCE_COMMIT"
          git show "$VERIFIER_SOURCE_COMMIT:src/verify_local_tables.cpp" > build-trace-root/verify_local_tables.cpp
          test "$(git hash-object build-trace-root/verify_local_tables.cpp)" = "$VERIFIER_SOURCE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-trace-root/verify_local_tables.cpp')
          s=p.read_text()
          old='if (total != candidate_config::span_capacity_num)\n                throw std::runtime_error("pair span capacity mismatch");'
          new='if (total != candidate_config::span_capacity_num[span - 1])\n                throw std::runtime_error("pair span capacity mismatch");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          print('capacity_compatibility_patch_only=True')
          PY
          g++ -std=c++17 -O3 -march=x86-64 -DNDEBUG -ffp-contract=off \
            -Ibuild-trace-root build-trace-root/verify_local_tables.cpp \
            -o build-trace-root/verify_local_tables

      - name: Reuse certified root 17-term outward-rounded tables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf shared-root-tables
          mkdir shared-root-tables
          gh run download "$TABLE_SOURCE_RUN" -n "$TABLE_SOURCE_ARTIFACT" -D shared-root-tables
          TABLE_DIR="$(dirname "$(find shared-root-tables -name w_lower.bin -print -quit)")"
          test -n "$TABLE_DIR"
          test -f "$TABLE_DIR/w_second_lower.bin"
          test -f "$TABLE_DIR/w_mid_lower.bin"
          test -f "$TABLE_DIR/w_mid_upper.bin"
          test -f "$TABLE_DIR/w_prime_mid_lower.bin"
          test -f "$TABLE_DIR/w_prime_mid_upper.bin"
          test -f "$TABLE_DIR/manifest.json"
          echo "TABLE_DIR=$TABLE_DIR" >> "$GITHUB_ENV"

      - name: Probe hardened root frontier 0.00791105 0.00791108 0.00791110
        shell: bash
        run: |
          : > trace-root-00791105.log
          : > trace-root-00791108.log
          : > trace-root-00791110.log
          set +e
          build-trace-root/verify_local_tables 158221 20000000 "$TABLE_DIR" 100000000 \
            | tee trace-root-00791105.log
          code105=${PIPESTATUS[0]}
          build-trace-root/verify_local_tables 197777 25000000 "$TABLE_DIR" 100000000 \
            | tee trace-root-00791108.log
          code108=${PIPESTATUS[0]}
          build-trace-root/verify_local_tables 79111 10000000 "$TABLE_DIR" 100000000 \
            | tee trace-root-00791110.log
          code110=${PIPESTATUS[0]}
          set -e
          echo "eps_00791105_exit_code=$code105" >> "$GITHUB_STEP_SUMMARY"
          echo "eps_00791108_exit_code=$code108" >> "$GITHUB_STEP_SUMMARY"
          echo "eps_00791110_exit_code=$code110" >> "$GITHUB_STEP_SUMMARY"
          # 0.00791105 is the new conservative frontier target; tighter probes are bonus-only.
          if [[ "$code105" != "0" ]]; then exit "$code105"; fi

      - name: Upload root-frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-root-frontier-hardened
          path: |
            trace-root-00791105.log
            trace-root-00791108.log
            trace-root-00791110.log
          if-no-files-found: warn
